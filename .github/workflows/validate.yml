name: Validate Luau foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        run: python3 tools/bootstrap.py
      - name: Compile, check Roblox types and run tests
        run: python3 tools/test.py
      - name: Build Rojo place
        run: |
          mkdir -p build
          .tools/rojo build default.project.json --output build/BikeEvolutionSimulator.rbxlx
      - name: Upload Roblox Studio place
        uses: actions/upload-artifact@v4
        with:
          name: BikeEvolutionSimulator-Studio
          path: build/BikeEvolutionSimulator.rbxlx
          if-no-files-found: error
      - name: Package V4 Studio build with provenance
        run: python3 tools/package_v4.py
      - name: Upload V4 Studio build
        uses: actions/upload-artifact@v4
        with:
          name: BikeEvolutionSimulator-V4
          path: build/v4/
          if-no-files-found: error
      - name: Package V4.1 permanent-bike Studio build
        run: python3 tools/package_v4.py --version V4.1
      - name: Upload V4.1 Studio build
        uses: actions/upload-artifact@v4
        with:
          name: BikeEvolutionSimulator-V4.1
          path: build/v4.1/
          if-no-files-found: error
      - name: Package V4.2 rider transform fix
        run: python3 tools/package_v4.py --version V4.2
      - name: Upload V4.2 Studio build
        uses: actions/upload-artifact@v4
        with:
          name: BikeEvolutionSimulator-V4.2
          path: build/v4.2/
          if-no-files-found: error
