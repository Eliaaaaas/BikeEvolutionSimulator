name: Validate Luau foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        run: python3 tools/bootstrap.py
      - name: Compile, check Roblox types and run tests
        run: python3 tools/test.py
      - name: Build Rojo place
        run: |
          mkdir -p build
          .tools/rojo build default.project.json --output build/BikeEvolutionSimulator.rbxlx
      - name: Upload Roblox Studio place
        uses: actions/upload-artifact@v4
        with:
          name: BikeEvolutionSimulator-Studio
          path: build/BikeEvolutionSimulator.rbxlx
          if-no-files-found: error
